[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stayvise-backend"
version = "0.1.0"
description = "StayVise — WhatsApp-native milestone escrow platform for Indian freelancers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic-settings==2.6.0",
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.4.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "razorpay>=1.4.1",
    "python-multipart>=0.0.12",
    "email-validator>=2.1.0",
    "resend>=2.4.0",
    "bleach>=6.1.0",
    # Production hardening
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "pytest-dotenv>=0.5.0",
    "coverage[toml]>=7.4.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "aiosqlite>=0.20.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "pytest-dotenv>=0.5.0",
    "coverage[toml]>=7.4.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env_files = [".env.test"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
fail_under = 80

[tool.hatch.build.targets.wheel]
packages = ["app"]
